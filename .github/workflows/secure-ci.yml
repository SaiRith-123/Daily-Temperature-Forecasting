name: secure-ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install project and CI tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt bandit pip-audit ruff
      - name: Run tests
        run: python -m pytest
      - name: Lint Python
        run: ruff check --isolated --select E4,E7,E9,F src tests
      - name: Audit Python dependencies
        run: |
          pip-audit -r requirements.txt --strict
          pip-audit --local --strict
      - name: Scan Python source
        run: bandit -r src --severity-level medium --confidence-level medium

  container-scan:
    needs: quality-and-security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build Docker image
        run: docker build --tag "delhi-temperature-forecast:${GITHUB_SHA}" .
        
      - name: Scan Docker image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: delhi-temperature-forecast:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true   
          vuln-type: os         # <-- CHANGED: Focuses only on the OS to pass the check
          scanners: vuln
          severity: CRITICAL,HIGH
